[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_alive"
version = "0.1.0"
description = "Turns a Reachy Mini into a desk companion that feels alive."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    # Must match the daemon running on the robot.
    "pydantic>=2.13.5",
    "reachy-mini==1.10.0",
    "soundfile>=0.14.0",
]
keywords = ["reachy-mini-app"]

[dependency-groups]
dev = [
    "pytest",
    "reachy-mini[mujoco]",
]

[project.entry-points."reachy_mini_apps"]
reachy_alive = "reachy_alive.main:ReachyAlive"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
reachy_alive = ["**/*"] # Also include all non-.py files

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
try-move = "reachy_alive.scripts.try_move:main"
