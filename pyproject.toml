[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_alive"
version = "1.1.1"
description = "Turns a Reachy Mini into a desk companion that feels alive."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Hugo Turlet", email = "hugo.turlet@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "numpy",
    "pydantic>=2",
    # Installed into the robot's shared apps environment, next to the
    # daemon's SDK. 1.13 is the first to download a dataset without a token
    # (RecordedMoves(token=False)); robots update from Reachy Mini Control.
    # uv.lock pins the exact version used for development.
    "reachy-mini>=1.13.0,<2",
    "soundfile",
]
keywords = ["reachy-mini-app"]

[project.urls]
Repository = "https://github.com/HTurlet15/reachy_alive"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "reachy-mini[mujoco]",
    "ruff>=0.17.1",
]

[project.entry-points."reachy_mini_apps"]
reachy_alive = "reachy_alive.main:ReachyAlive"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_alive*"]

[tool.setuptools.package-data]
reachy_alive = ["assets/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
try-move = "reachy_alive.scripts.try_move:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]
ignore = [
    "B027",  # optional hooks (Sense.open, Detector._while_robot_moves…) are empty on purpose
]

[tool.ruff.lint.per-file-ignores]
# Test names say what they check: no docstring per test.
# Test packages exist only so pytest can tell same-named files apart.
"tests/**" = ["D102", "D103", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"