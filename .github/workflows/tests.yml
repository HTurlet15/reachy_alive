name: tests

# When: on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # A fresh Ubuntu machine, thrown away after the run.
    runs-on: ubuntu-24.04
    steps:
      # Copy the repository onto the machine.
      - uses: actions/checkout@v4

      # The Reachy Mini SDK won't import without GStreamer.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev libgirepository1.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base

      # Install uv, with the same Python as the robot.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Install the project exactly as locked; fails if uv.lock is out of date.
      - run: uv sync --locked

      - run: uv run pytest