name: sync to Hugging Face

# Publish a release: mirror the tagged commit to the Space, which Reachy Mini
# Control installs as-is. Merges to main don't publish anything.
# workflow_dispatch adds a "Run workflow" button in the Actions tab: run it on
# an older tag to roll the Space back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sync:
    # Only release tags reach the Space, even from the manual button.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history, to check where the tag points
      # A tag can point anywhere, even at a commit no pull request reviewed.
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: HTurlet15/reachy_alive
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: static