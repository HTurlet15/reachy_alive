<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reachy Alive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Reachy Alive</h1>

    <h2>Moves</h2>
    <div id="moves"></div>
    <p id="move-status"></p>

    <h2>Idle moves</h2>
    <form id="interval-form">
        <label>Wait between
            <input type="number" id="interval-min" min="5" max="600" step="1" required>
        </label>
        <label>and
            <input type="number" id="interval-max" min="5" max="600" step="1" required>
            seconds
        </label>
        <button type="submit">Save</button>
    </form>
    <p id="interval-status"></p>

    <script src="/static/main.js"></script>
</body>

</html>
